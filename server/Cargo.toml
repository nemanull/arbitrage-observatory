[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
opentelemetry-appender-tracing = "0.33.0"
opentelemetry-otlp = "0.33.0"
opentelemetry_sdk = "0.33.0"
rand = "0.9.5"
reqwest = { version = "0.13.5", features = ["json"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full", "test-util"] }
