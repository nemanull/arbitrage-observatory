# Vendored SigNoz stack, pulled in by the root docker-compose.yaml.
# Refresh it with ./refresh.sh, which re-fetches the generated manifests from SigNoz/foundry.
#
# Everything here is the upstream generator output except five edits, each marked "Local edit".
# Re-apply them after a refresh.
#
# The top level name is ignored, because `include` merges these services into the root project.
name: signoz
# Local edit: the generator pins container_name, and fixed network and volume names, which are
# global to the Docker daemon. Another SigNoz on the same host would fight this one for them, and
# deleting a volume in one project would take the other project's telemetry with it. Dropping the
# names lets Compose scope all three to the project. Service names are unchanged, and Compose
# aliases every service by name on the network, so the hostnames in the config files still resolve.
networks:
  signoz-network: {}
services:
  ingester:
    command:
    - -c
    - |
      /signoz-otel-collector migrate sync check &&
      /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/opamp-config.yaml --copy-path=/var/tmp/collector-config.yaml
    # Local edit: without this the collector restart-loops until the schema exists,
    # and `docker compose up --wait` fails on the migrator exiting.
    depends_on:
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully
    deploy:
      replicas: 1
    entrypoint:
    - /bin/sh
    environment:
    - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
    - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    image: signoz/signoz-otel-collector:latest
    networks:
      signoz-network:
        aliases:
        - signoz-ingester
    # Local edit: shifted off the OTLP defaults and bound to loopback, matching
    # the Postgres and Redis port convention in the root docker-compose.yaml.
    ports:
    - 127.0.0.1:${SIGNOZ_OTLP_GRPC_PORT:-4417}:4317
    - 127.0.0.1:${SIGNOZ_OTLP_HTTP_PORT:-4418}:4318
    restart: unless-stopped
    volumes:
    - ./ingester/ingester.yaml:/etc/otel-collector-config.yaml:ro
    - ./ingester/opamp.yaml:/etc/opamp-config.yaml:ro
  signoz-metastore-postgres-0:
    environment:
    - POSTGRES_DB=signoz
    - POSTGRES_PASSWORD=signoz
    - POSTGRES_USER=signoz
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 30s
      test:
      - CMD-SHELL
      - pg_isready -U signoz -d signoz
      timeout: 10s
    image: postgres:16
    networks:
    - signoz-network
    restart: unless-stopped
    volumes:
    - signoz-metastore-postgres-0-data:/var/lib/postgresql/data
  signoz-signoz-0:
    # Local edit: the backend reads both stores on boot, so it waits for the
    # metastore and for the ClickHouse schema migration.
    depends_on:
      signoz-metastore-postgres-0:
        condition: service_healthy
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully
    environment:
    - SIGNOZ_SQLSTORE_POSTGRES_DSN=postgres://signoz:signoz@signoz-metastore-postgres-0:5432/signoz?sslmode=disable
    - SIGNOZ_SQLSTORE_PROVIDER=postgres
    - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
    - SIGNOZ_TELEMETRYSTORE_PROVIDER=clickhouse
    # Local edit: without this SigNoz signs session tokens with no secret and logs a critical
    # warning on every boot. The default is fine for a loopback instance, override it elsewhere.
    - SIGNOZ_TOKENIZER_JWT_SECRET=${SIGNOZ_JWT_SECRET:-observatory-local-dev-secret}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 60s
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:8080/api/v1/health
      timeout: 10s
    image: signoz/signoz:latest
    networks:
    - signoz-network
    # Local edit: 8080 is a commonly taken port, so the UI is shifted and bound to loopback.
    ports:
    - 127.0.0.1:${SIGNOZ_PORT:-8180}:8080
    restart: unless-stopped
  signoz-telemetrykeeper-clickhousekeeper-0:
    entrypoint:
    - /usr/bin/clickhouse-keeper
    - --config-file=/etc/clickhouse-keeper/keeper.yaml
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
      - CMD
      - clickhouse-keeper-client
      - -h
      - localhost
      - -p
      - "9181"
      - -q
      - ls
      timeout: 10s
    image: clickhouse/clickhouse-keeper:25.12.5
    networks:
    - signoz-network
    restart: unless-stopped
    volumes:
    - signoz-telemetrykeeper-0-data:/var/lib/clickhouse-keeper
    - ./telemetrykeeper/clickhousekeeper/keeper-0.yaml:/etc/clickhouse-keeper/keeper.yaml:ro
  signoz-telemetrystore-clickhouse-0-0:
    depends_on:
      signoz-telemetrykeeper-clickhousekeeper-0:
        condition: service_healthy
      signoz-telemetrystore-clickhouse-user-scripts:
        condition: service_completed_successfully
    environment:
    - CLICKHOUSE_SKIP_USER_SETUP=1
    - CLICKHOUSE_CONFIG=/etc/clickhouse-server/config-0-0.yaml
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 40s
      test:
      - CMD
      - wget
      - --spider
      - -q
      - http://localhost:8123/ping
      timeout: 10s
    image: clickhouse/clickhouse-server:25.12.5
    # Local edit: ClickHouse sizes its memory budget from the memory it can see.
    # Without a cgroup limit it would claim most of the host on a development machine.
    mem_limit: ${SIGNOZ_CLICKHOUSE_MEM_LIMIT:-3g}
    networks:
    - signoz-network
    restart: unless-stopped
    volumes:
    - signoz-telemetrystore-0-0-data:/var/lib/clickhouse
    - signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts:ro
    - ./telemetrystore/clickhouse/config-0-0.yaml:/etc/clickhouse-server/config-0-0.yaml:ro
    - ./telemetrystore/clickhouse/functions.yaml:/etc/clickhouse-server/functions.yaml:ro
  signoz-telemetrystore-clickhouse-user-scripts:
    command:
    - bash
    - -c
    - |-
      version="v0.0.1"
      node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
      node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
      echo "Fetching histogram-binary for $${node_os}/$${node_arch}"
      cd /tmp
      wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
      tar -xvzf histogram-quantile.tar.gz
      mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    image: clickhouse/clickhouse-server:25.12.5
    networks:
    - signoz-network
    restart: on-failure
    volumes:
    - signoz-telemetrystore-user-scripts:/var/lib/clickhouse/user_scripts
  signoz-telemetrystore-migrator:
    command:
    - -c
    - |
      /signoz-otel-collector migrate ready &&
      /signoz-otel-collector migrate bootstrap &&
      /signoz-otel-collector migrate sync up &&
      /signoz-otel-collector migrate async up
    entrypoint:
    - /bin/sh
    environment:
    - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://signoz-telemetrystore-clickhouse-0-0:9000
    - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    image: signoz/signoz-otel-collector:latest
    networks:
    - signoz-network
    restart: on-failure
volumes:
  signoz-metastore-postgres-0-data: {}
  signoz-telemetrykeeper-0-data: {}
  signoz-telemetrystore-0-0-data: {}
  signoz-telemetrystore-user-scripts: {}
